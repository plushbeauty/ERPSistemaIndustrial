name: Build ERP Industrial

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: TypeScript
        run: npm run type-check
      - name: Auditoria de interacoes
        run: npm run audit:interactions
      - name: Build de producao
        run: npm run build
