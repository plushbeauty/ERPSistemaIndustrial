name: Build ERP Industrial

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: erp-industrial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run type-check
      - name: Auditoria de interações
        run: npm run audit:interactions
      - name: Build de produção
        run: npm run build
