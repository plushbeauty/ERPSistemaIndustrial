name: "Auditoria Brutal e Homologação"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: brutal-homologation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homologation:
    name: "TypeScript + Auditoria Global + Interações + Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Limitar heap do Node"
        run: echo "NODE_OPTIONS=--max-old-space-size=4096" >> "$GITHUB_ENV"
      - name: "Instalar dependências"
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: "Type-check estrito"
        id: typecheck
        continue-on-error: true
        run: |
          npm run type-check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status
      - name: "Publicar diagnóstico TypeScript"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 2
      - name: "Falhar se TypeScript falhou"
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: "Auditoria global ponta a ponta"
        id: global-audit
        continue-on-error: true
        run: |
          npm run audit:global > global-audit.log 2>&1
          status=$?
          cat global-audit.log
          exit $status
      - name: "Publicar diagnóstico da auditoria global"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-audit-diagnostics
          path: global-audit.log
          if-no-files-found: warn
          retention-days: 2
      - name: "Falhar se auditoria global encontrou bloqueadores"
        if: steps.global-audit.outcome == 'failure'
        run: exit 1
      - name: "Auditoria estática de interações"
        id: audit
        continue-on-error: true
        run: |
          npm run audit:interactions > audit.log 2>&1
          status=$?
          cat audit.log
          exit $status
      - name: "Publicar diagnóstico da auditoria"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-diagnostics
          path: audit.log
          if-no-files-found: warn
          retention-days: 2
      - name: "Falhar se auditoria de interações falhou"
        if: steps.audit.outcome == 'failure'
        run: exit 1
      - name: "Build de produção"
        run: npm run build
