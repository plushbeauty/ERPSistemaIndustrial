name: "Auditoria Brutal e Homologação"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: brutal-homologation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homologation:
    name: "TypeScript + Auditoria + Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Limitar heap do Node"
        run: echo "NODE_OPTIONS=--max-old-space-size=4096" >> "$GITHUB_ENV"
      - name: "Instalar dependências"
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: "Type-check estrito"
        run: npm run type-check
      - name: "Auditoria estática de interações"
        run: npm run audit:interactions
      - name: "Build de produção"
        run: npm run build
