name: Industrial Code Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Auditoria estática de padronização das telas
        run: npm run audit:ui-standardization
      - name: Approved UI immutable hash lock
        run: npm run verify:approved-ui-lock
      - run: npm run type-check
      - run: npm run lint:check
      - run: npm run audit:global
      - run: npm run audit:brutal
      - run: npm run audit:interactions
      - run: npm run build
      - run: npm run verify:build
      - run: npm run verify-routes
      - name: Publicar relatório de auditoria visual estática
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-ui-standardization-audit
          path: docs/erp-standardization/generated/ui-audit.json
          if-no-files-found: warn
