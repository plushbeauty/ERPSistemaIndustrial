name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_HQocQmxw6ctXcrLRfbbNEoMw
  VERCEL_PROJECT_ID: prj_Dxf8Hg9DB2Jz70YJjxaktSn03ECc

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --legacy-peer-deps

      - name: TypeScript
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Deploy Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@41.7.2 deploy --prod --yes --token="$VERCEL_TOKEN" --cwd .
