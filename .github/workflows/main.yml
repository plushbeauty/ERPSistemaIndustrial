name: ERP Industrial CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: erp-industrial-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npm run type-check

      - name: Build
        run: npm run build


