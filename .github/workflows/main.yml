# 📝 IDENTIFICAÇÃO DE LEITURA E REVISÃO DE CÓDIGO:
# - Arquivo: .github/workflows/main.yml
# - Status Atual: Revisão 1
# - Total de Linhas Lido/Gerado: 32
# - Assinatura de Entrada (Primeiros 3 Imports): Não se aplica a YAML; name, on, permissions
# - Integração Concretizada: pipeline real do ERP com npm ci, type-check e build na branch main.

name: ERP Industrial CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: erp-industrial-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript
        run: npm run type-check

      - name: Build
        run: npm run build
