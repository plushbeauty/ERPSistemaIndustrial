name: P0 Lockfile Generator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile when missing
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
            test -s package-lock.json
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit generated lockfile
        if: steps.lock.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): add deterministic npm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
