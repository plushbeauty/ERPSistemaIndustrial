# =========================================================================
# INDUSTRIAL PRODUCTION GATE
# Bloqueia publicação quando o contrato Supabase, lint, type-check ou build falhar.
# =========================================================================
name: Industrial Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Supabase contract gate
        run: npm run verify:supabase-env
      - name: Lint
        run: npm run lint:check
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
