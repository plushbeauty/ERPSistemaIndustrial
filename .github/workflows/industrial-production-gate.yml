# ERP Industrial — Production Gate
name: Industrial Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-gate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Supabase contract gate
        run: npm run verify:supabase-env
      - name: Global security/config audit
        run: npm run audit:global
      - name: Brutal structural audit
        run: npm run audit:brutal
      - name: Interaction audit
        run: npm run audit:interactions
      - name: Lint
        run: npm run lint:check
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Release gate summary
        run: npm run verify:release
