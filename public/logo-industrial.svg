  <text x="135" y="72" font-family="'Inter', sans-serif" font-weight="900" font-size="52" fill="url(#synqra-blue)" letter-spacing="2">SYNQRA</text>
  <text x="138" y="96" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#00A3FF" letter-spacing="4">ERP &amp; SGQ INDUSTRIAL</text>
