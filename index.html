<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f3d34" />
<meta name="description" content="SGQ ERP - Sistema de Gestão Industrial" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/logo/sgq-erp.png" type="image/png" />
<title>SGQ ERP - Sistema de Gestão Industrial</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7f6;color:#14211e;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.boot-card{width:min(520px,100%);background:#fff;border:1px solid #dce6e2;border-radius:20px;padding:34px;box-shadow:0 20px 60px rgba(15,61,52,.10);text-align:center}
.boot-logo{width:64px;height:64px;object-fit:contain;margin-bottom:14px}
.boot-title{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}
.boot-text{margin:10px 0 0;color:#60716c;font-size:14px;line-height:1.6}
.boot-spinner{width:22px;height:22px;margin:22px auto 0;border:3px solid #dce6e2;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}
#boot-failure{display:none;margin-top:22px;padding:14px;border-radius:12px;background:#fff5f5;color:#9b2525;font-size:13px;line-height:1.5;text-align:left}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root">
  <div id="boot" aria-live="polite">
    <div class="boot-card">
      <img class="boot-logo" src="/logo/sgq-erp.png" alt="SGQ ERP" />
      <h1 class="boot-title">SGQ ERP INDUSTRIAL</h1>
      <p class="boot-text">Inicializando o ambiente seguro do sistema…</p>
      <div class="boot-spinner" aria-hidden="true"></div>
      <div id="boot-failure">O aplicativo não conseguiu iniciar. Atualize a página. Se esta mensagem permanecer, a configuração de ambiente do ERP precisa ser corrigida antes do login.</div>
    </div>
  </div>
</div>
<script>
  window.setTimeout(function(){
    var root=document.getElementById('root');
    var failure=document.getElementById('boot-failure');
    if(root && root.children.length===1 && root.firstElementChild && root.firstElementChild.id==='boot' && failure) failure.style.display='block';
  },5000);
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
