<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#123B50" />
<meta name="description" content="SYSNQRA ERP & SGQ INDUSTRIAL - Sistema de Gestão Industrial" />
<link rel="icon" href="/logo/logo.png" type="image/png" />
<title>SYSNQRA ERP & SGQ INDUSTRIAL - Sistema de Gestão Industrial</title>
<style>
html,body{margin:0;min-height:100%;background:#F4FBFD;color:#123B50;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.boot-card{width:min(520px,100%);background:#fff;border:1px solid #d8e4ea;border-radius:4px;padding:34px;box-shadow:0 20px 60px rgba(18,59,80,.10);text-align:center}
.boot-logo{width:64px;height:64px;object-fit:contain;margin-bottom:14px}
.boot-title{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}
.boot-text{margin:10px 0 0;color:#627985;font-size:14px;line-height:1.6}
.boot-spinner{width:22px;height:22px;margin:22px auto 0;border:3px solid #d8e4ea;border-top-color:#2D8DB8;border-radius:50%;animation:spin .8s linear infinite}
#boot-failure{display:none;margin-top:22px;padding:14px;border-radius:4px;background:#fff5f5;color:#9b2525;font-size:13px;line-height:1.5;text-align:left}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
</style>
</head>
<body>
<div id="root">
  <div id="boot" aria-live="polite">
    <div class="boot-card">
      <img class="boot-logo" src="/logo/logo.png" alt="SYSNQRA ERP & SGQ INDUSTRIAL" />
      <h1 class="boot-title">SYSNQRA ERP & SGQ INDUSTRIAL</h1>
      <p class="boot-text">Inicializando o ambiente seguro do sistema…</p>
      <div class="boot-spinner" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
